[package]
name = "cadbridge"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "cadhost"
path = "src/host.rs"

[dependencies]
solidcraft-engine = { path = "../../engine-src/crates/engine" }
solidcraft-viewport = { path = "../../engine-src/crates/viewport" }
serde_json = { version = "1", features = ["float_roundtrip"] }
jni = "0.21"

[profile.release]
opt-level = 3
lto = "off"
codegen-units = 16
debug = false
strip = true
panic = "unwind"

[profile.dev]
opt-level = 1
debug = false
incremental = false
[profile.dev.package."*"]
opt-level = 2
debug = false
