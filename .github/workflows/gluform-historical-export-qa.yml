name: GLUform historical export QA tests

on:
  push:
    branches:
      - glu/qa-historical-export-redaction-20261122
    paths:
      - 'android/app/src/main/java/com/gluform/app/Diagnostics.kt'
      - 'android/app/src/test/java/com/gluform/app/DiagnosticsTest.kt'
      - '.github/workflows/gluform-historical-export-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostics-unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android API 35
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run diagnostics regression tests
        working-directory: android
        run: gradle --no-daemon :app:testDebugUnitTest --tests 'com.gluform.app.DiagnosticsTest'
